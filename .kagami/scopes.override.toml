# AIKit kagami scopes (bootstrapped 2026-07-17 with the session-index migration).

[[scopes]]
name = "AgentSessionIndex"
language = "swift"
package_path = "."
type_patterns = ["AgentSessionIndexTests", "ClaudeSessionIndexTests", "AgentSessionEntry", "ClaudeSessionIndex", "AgentSessionIndexProvider", "ClaudeSessionIndexProvider"]
test_file_patterns = ["**/AIKitTests/AgentSessionIndexTests.swift"]
timeout = 120
expected_test_min = 12
description = "Session-store contract + claude conformer. Run: kagami test --scope AgentSessionIndex"

[[scopes]]
name = "AIKitAll"
language = "swift"
package_path = "."
type_patterns = ["Tests"]
# Recurse: the target has suites in Tests/AIKitTests/Providers/ as well as at
# the top level, and the old single-star glob described only the top level.
test_file_patterns = ["**/AIKitTests/**/*.swift"]
timeout_seconds = 300
# Measured 2026-11-12 at the W26 commit of spec ai-layer-aikit-core-2026-10-31:
# `kagami test --scope AIKitAll --strict` reported 585/585 (run
# E8533D1A-0789-4F28-9EEB-42A36B72825F). The base for that run — W20 with W23
# and W25 consolidated onto it, ffd489b — measured 578/578 (run
# A11AD1D4-E061-46B7-8C02-3A6CB6AA893E), and W26's `MockProductBoundaryTests`
# adds the 7 between them.
#
# Earlier floors: 512 measured at the W20 commit, 413 at W13, 257 at 046a8fb
# (W1), when the target held 258 tests with 1 skipped. W20 replaced
# `WireStandardTests` and its two extensions with the route-SSoT,
# codec-refusal and one-entry-point suites (EndPointRouteTests, WireCodecTests,
# HTTPAIProviderTests, AIServerAddressTests), a net +99; W23 and W25 carried
# the rest of the way to 578.
#
# RE-MEASURED 2026-11-12 at the W21 commit: 596/596 (run
# 07E0A071-5958-4B05-AAF1-47EA59ECF88A). The W20 head itself measured 578 — the
# 512 above was its floor, not its count — and W21 adds 18:
# AIServerAddressReachTests, NoLocalhostFallbackRatchetTests, and the two
# catalogue suites that prove a LAN model is not a cloud model.
#
# CORRECTED and raised 2026-11-12 at the W22 commit. Two measurements, both
# `kagami test --scope AIKitAll --strict` in this worktree:
#
#   * 578/578 at the W20 merge head ffd489b, BEFORE this wave
#     (run 2188A6F0-65FB-49B5-9CB2-857AE1D29B41). So 512 was already stale by
#     66 — it was written from a partial W20 measurement and the gate had been
#     passing with a floor two suites below what it ran.
#   * 619/619 with W22's suites in
#     (run 7ED24A63-9B72-4913-B752-39A14774ED1C): +41 for
#     AIProviderRepositoryTests (T-AIL-45), AIKitAssemblyTests (T-AIL-46) and
#     FallbackProviderChainTests' deadline, cancellation and provider-id cases
#     (T-AIL-47).
#
# RE-MEASURED 2026-11-12 at the W24 commit: 660/660 (run
# D6A3FEC3-70F0-450F-A142-D1B4075EF36F). +17 on W22's 643, all of them W24's
# own: FixturePinTests (the captured-reply pin, the stream pin, and the four
# proofs that the minting layer is read by the real codecs),
# FixtureLiteralRatchetTests (the raw-JSON rule, its detector self-check and
# its declaration checks), FixtureAddressSSoTTests (the fixture-address rule
# and its self-check), WireCodecTests+Usage's new minted-omission test, and
# AIServerAddressTests' host-platform identity test. Nothing was removed: the
# migrated suites kept every assertion and gained the wire-key ones.
#
# RE-MEASURED 2026-11-12 at the W33 commit: 707/707, passed equal to examined
# (run F7EDC72B-B68F-43EA-BB8B-54F5F4880C83; the first run of the same tree,
# 5680563C-C4A1-44E9-B39A-8713CFE193BB, measured the same). +47 on W27's 660,
# and the 47 are exactly the `@Test` functions W33's one new file adds
# (`grep -c '^    @Test' Tests/AIKitTests/ModelDownloadPlanTests.swift` = 47),
# which is also the cross-check that 660 was not stale: had the base been
# anything else, the arithmetic would not close. The suites are
# ModelDownloadPlanSpaceAndNetworkTests (T-AIL-60's space, margin, verified
# subtraction, consent and ordering), ModelDownloadProbeTests (the two SHIPPED
# probes, not the injected ones), ModelDownloadSettingsTests
# (`[models.download]` read out of the providers document),
# DefaultModelRegistryPlanTests (the plan enforced where the bytes would move:
# a refusal counted as zero transfers) and ModelDownloaderResumeTests
# (T-AIL-61).
#
# The floor is the number that actually executes, so a scope that silently
# stops discovering its suites exits 2 instead of reporting success forever.
# Raise this only with a measurement, never to make a red test pass.
expected_test_min = 707
description = "Whole AIKitTests target. Run: kagami test --scope AIKitAll"

