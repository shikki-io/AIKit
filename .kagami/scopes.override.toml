# AIKit kagami scopes (bootstrapped 2026-07-17 with the session-index migration).

[[scopes]]
name = "AgentSessionIndex"
language = "swift"
package_path = "."
type_patterns = ["AgentSessionIndexTests", "ClaudeSessionIndexTests", "AgentSessionEntry", "ClaudeSessionIndex", "AgentSessionIndexProvider", "ClaudeSessionIndexProvider"]
test_file_patterns = ["**/AIKitTests/AgentSessionIndexTests.swift"]
timeout = 120
expected_test_min = 12
description = "Session-store contract + claude conformer. Run: kagami test --scope AgentSessionIndex"

[[scopes]]
name = "AIKitAll"
language = "swift"
package_path = "."
type_patterns = ["Tests"]
# Recurse: the target has suites in Tests/AIKitTests/Providers/ as well as at
# the top level, and the old single-star glob described only the top level.
test_file_patterns = ["**/AIKitTests/**/*.swift"]
timeout_seconds = 300
# Measured 2026-10-31 at 046a8fb (W1 of spec ai-layer-aikit-core-2026-10-31):
# 258 tests discovered, 257 passed, 0 failed, 1 skipped (the MLX live-synthesis
# test, which needs a real model on disk). The floor is the number that
# actually executes, so a scope that silently stops discovering its suites
# exits 2 instead of reporting success forever. Raise this only with a
# measurement, never to make a red test pass.
expected_test_min = 257
description = "Whole AIKitTests target. Run: kagami test --scope AIKitAll"

[[scopes]]
name = "AIKitProviders"
language = "swift"
package_path = "."
type_patterns = ["ProviderModelCatalog", "AnthropicFamily", "HistoricalAnthropicId", "ModelAliasMap", "ArgsTemplate", "CLISubprocessProviderConfig", "StreamEvent", "StreamParsing", "ClaudeCodeStreamJSONParser", "CursorTextParser", "AiderMixedParser", "ProviderHealthCheck", "AIProviderID", "AgentProviding", "BudgetLedger", "CLISubprocessProvider", "FallbackProviderChain", "LMStudioProvider", "ProviderModelCatalogTests", "ModelAliasResolutionTests", "ArgsTemplateRenderingTests", "ClaudeCodeStreamJSONParserTests", "CursorTextParserTests", "AiderMixedParserTests", "CLISubprocessProviderInitTests", "BudgetDeductionTests", "ConcurrencyCapTests", "FallbackProviderChainTests", "LMStudioProviderTests", "ProviderHealthCheckTests"]
test_file_patterns = ["**/AIKitTests/Providers/*.swift"]
timeout = 120
expected_test_min = 106
description = "Provider family relocated from shikki: catalog, alias map, args template, stream parsers, health check (S1) plus the CLI subprocess provider, fallback chain, LM Studio provider, budget ledger and provider-id vocabulary (S2). Run: kagami test --scope AIKitProviders"

[[scopes]]
name = "AIKitLive"
language = "swift"
package_path = "."
test_target_name = "AIKitLiveTests"
pre_pr_default = false
timeout_seconds = 120

# W7 of spec ai-layer-aikit-core-2026-10-31. AIKitAll resolves to the
# AIKitTests target alone, so the on-device provider's suite needs its own
# scope or no gate ever runs it.
#
# pre_pr_default = false for the same reason AIKitLive carries it: the scope
# needs something the machine may not have. AIKitMLXTests links mlx-swift,
# whose Metal kernels are compiled from source on every Apple platform, so the
# scope cannot build unless the SELECTED Xcode has its MetalToolchain component
# installed. Check with `xcodebuild -showComponent MetalToolchain`; install with
# `xcodebuild -downloadComponent MetalToolchain`. On 2026-10-31 the selected
# Xcode 27.2 RC reported "uninstalled" while 27.0 and 26.6 reported
# "installed", which is why this is opt-in rather than a pre-PR default.
#
# No expected_test_min yet: the floor must be a measurement, and this scope has
# not been measured under the fleet's selected toolchain.
[[scopes]]
name = "AIKitMLX"
expected_test_min = 29
language = "swift"
package_path = "."
test_target_name = "AIKitMLXTests"
pre_pr_default = false
timeout_seconds = 600
description = "On-device MLX provider, extracted from shikki-client (W7). Needs the Metal toolchain. Run: kagami test --scope AIKitMLX"

[[scopes]]
name = "AIKitVoiceLive"
language = "swift"
package_path = "."
test_target_name = "AIKitLiveTests"
type_patterns = ["VoiceLoopbackLiveTests"]
pre_pr_default = false
timeout_seconds = 180
