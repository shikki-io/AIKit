# AIKit kagami scopes (bootstrapped 2026-07-17 with the session-index migration).

[[scopes]]
name = "AgentSessionIndex"
language = "swift"
package_path = "."
type_patterns = ["AgentSessionIndexTests", "ClaudeSessionIndexTests", "AgentSessionEntry", "ClaudeSessionIndex", "AgentSessionIndexProvider", "ClaudeSessionIndexProvider"]
test_file_patterns = ["**/AIKitTests/AgentSessionIndexTests.swift"]
timeout = 120
expected_test_min = 12
description = "Session-store contract + claude conformer. Run: kagami test --scope AgentSessionIndex"

[[scopes]]
name = "AIKitAll"
language = "swift"
package_path = "."
type_patterns = ["Tests"]
test_file_patterns = ["**/AIKitTests/*.swift"]
timeout = 300
expected_test_min = 14
description = "Whole AIKitTests target. Run: kagami test --scope AIKitAll"

[[scopes]]
name = "AIKitProviders"
language = "swift"
package_path = "."
type_patterns = ["ProviderModelCatalog", "AnthropicFamily", "HistoricalAnthropicId", "ModelAliasMap", "ArgsTemplate", "CLISubprocessProviderConfig", "StreamEvent", "StreamParsing", "ClaudeCodeStreamJSONParser", "CursorTextParser", "AiderMixedParser", "ProviderHealthCheck", "ProviderModelCatalogTests", "ModelAliasResolutionTests", "ArgsTemplateRenderingTests", "ClaudeCodeStreamJSONParserTests", "CursorTextParserTests", "AiderMixedParserTests"]
test_file_patterns = ["**/AIKitTests/Providers/*.swift"]
timeout = 120
expected_test_min = 56
description = "Dependency-free provider family (catalog, alias map, args template, stream parsers, health check) relocated from shikki. Run: kagami test --scope AIKitProviders"
