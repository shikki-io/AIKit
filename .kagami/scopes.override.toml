# W21 of spec ai-layer-aikit-core-2026-10-31 (T-AIL-44). BR-AIL-18's enforcer:
# `?? "http"`, `?? "127.0.0.1"` and `?? "localhost"` are gone from Sources, and
# a route literal stays inside an `Endpoints/` directory. Its own scope rather
# than a line in AIKitAll, because a rule like this is cited in reviews by name
# and has to be runnable alone: `kagami test --scope AIKitNoLocalhostFallback`.
[[scopes]]
name = "AIKitNoLocalhostFallback"
language = "swift"
package_path = "."
test_target_name = "AIKitTests"
type_patterns = ["NoLocalhostFallbackRatchetTests", "FixtureAddressSSoTTests"]
test_file_patterns = ["**/AIKitTests/Wire/NoLocalhostFallbackRatchetTests.swift"]
timeout_seconds = 120
# Measured 2026-11-12 at the W21 commit: 4/4 — the ratchet itself (2 rules),
# its self-check, and the proof the scan read the tree.
#
# W24 adds `FixtureAddressSSoTTests` to the same file and the same scope: it is
# the Tests-side half of the same idea (the operator's LM Studio address is
# written once), and it shares this file's scanner rather than carrying a
# second copy of it. RE-MEASURED at the W24 commit: 6/6.
expected_test_min = 6
description = "BR-AIL-18 ratchet: no localhost fallback, no route literal outside Endpoints/, and the fixture address declared once. Run: kagami test --scope AIKitNoLocalhostFallback"

# W21, T-AIL-43. The address type on its own: the panel's ten inputs, the
# refusals that name the value, and `reach` — which is what stopped a LAN Mac
# from being reported as a cloud model.
[[scopes]]
name = "AIKitServerAddress"
language = "swift"
package_path = "."
test_target_name = "AIKitTests"
type_patterns = ["AIServerAddressTests", "AIServerAddressReachTests"]
test_file_patterns = ["**/AIKitTests/Wire/AIServerAddress*Tests.swift"]
timeout_seconds = 120
# Measured 2026-11-12 at the W21 commit: 28/28 (run
# E9768783-2A2A-473A-9439-CD20BFFD4935). kagami counts test FUNCTIONS, not the
# cases a parameterised one expands to, so this is lower than the number of
# addresses the suite actually classifies.
#
# LEFT AT 28 BY W24, DELIBERATELY, and this scope is RED — read this before
# changing the number.
#
# Measured at W24's base commit 73608c9, with none of W24's changes applied:
# 26/26 tests PASS and `kagami test --scope AIKitServerAddress --strict` exits
# 2 on `expected_test_min = 28 but only 26 test(s) executed` (run
# 212BEDF3-C715-40F9-9FAC-B68A5ADEE6B2). So the shortfall PREDATES W24: the
# floor was authored at 28 against a 28-test measurement at the W21 commit,
# and two test functions left the two files afterwards without the floor
# following them. W24 adds one (`AIRequestTarget`'s host platform is printed
# but is not part of its identity), taking the run to 27/27 — still two short.
#
# ACCOUNTED FOR (coordinator, after W24): the two functions are
# `anAbsentAddressIsNamed` and `aProviderWithNoAddressRefuses` in
# AIServerAddressReachTests. They tested `AIKitError.serverAddressNotConfigured`,
# which the W21/W22 merge (50f66d3, "merge epic (W21, W26) into W22") deleted:
# W22 made the address of `LMStudioProvider` and `MLXEngine` non-optional, so
# "no address configured" can no longer be written and the case had no
# producer. The file says so at "MARK: - Nothing configured at all"; a missing
# address in a settings file is refused at load and tested in
# AIProviderRepositoryTests. The behaviour left with its tests, so the floor
# follows: 26 + W24's one = 27, measured at ea5a2fb.
expected_test_min = 27
description = "AIServerAddress: validated once, nothing defaulted, reach classified (BR-AIL-18). Run: kagami test --scope AIKitServerAddress"

# W27 of spec ai-layer-aikit-core-2026-10-31 (T-AIL-52, T-AIL-53), BR-AIL-21.
# The public-surface ratchet: AIKit's and AIKitMLX's exported symbol graph must
# equal `AIKitPublicAPI.txt`, and no provider API may be in it.
#
# Its own scope, not a line in AIKitAll, for the same reason
# AIKitNoLocalhostFallback has one: a rule cited by name in a review has to be
# runnable alone — `kagami test --scope AIKitPublicSurface`.
#
# ITS OWN TEST TARGET, not a filter over AIKitTests. The suite shells out to a
# build, and measured in this worktree that cost the whole-target `AIKitAll`
# scope 11s -> 1m19s cold, with a 7-core compile running beside suites that
# assert a wall-clock budget. One such suite failed on the first run that way
# (FallbackProviderChainTests "the timeout is the whole chain's budget", run
# FE7289AE: a 5s budget spent on 0.2s of stub delay), and passed on every run
# after. A separate target removes the interaction instead of widening a
# number.
#
# WHAT IT NEEDS ON THE MACHINE. The suite runs `scripts/public-api.sh`, which
# builds BOTH `AIKit` and `AIKitMLX` with `-emit-symbol-graph` under its own
# scratch path (`.build/public-api`). AIKitMLX links mlx-swift, whose Metal
# kernels are compiled from source, so this scope needs the selected Xcode's
# MetalToolchain component — the same requirement the `AIKitMLX` scope carries.
# Check with `xcodebuild -showComponent MetalToolchain`.
#
# `pre_pr_default` is LEFT ON all the same, unlike the AIKitMLX scope: a public
# symbol slipping in is exactly the thing a pre-PR run exists to catch, and the
# AIKitMLX half of the surface is three symbols that must not grow. A builder
# without the toolchain sees a build failure naming it, not a silent pass.
#
# Timing measured in this worktree: ~40s for the first run (cold scratch, both
# targets), ~3s incremental afterwards. The timeout is the cold figure with
# room for a cold dependency graph.
[[scopes]]
name = "AIKitPublicSurface"
language = "swift"
package_path = "."
test_target_name = "AIKitPublicSurfaceTests"
test_file_patterns = ["**/AIKitPublicSurfaceTests/*.swift"]
timeout_seconds = 600
# Measured 2026-11-12 at the W27 commit: 4 test FUNCTIONS — the allowlist diff
# (T-AIL-52), the provider-API ratchet (T-AIL-53; one function, 33 parameterised
# cases), the AIKitMLX three-symbol pin, and the proof AIKitTestSupport exports
# the doubles. kagami counts functions, not the cases a parameterised one
# expands to.
#
# The other half of T-AIL-53 — that the `AIKit` PRODUCT carries no double — is
# `MockProductBoundaryTests`, which stays in `AIKitTests` and in `AIKitAll`
# where W26 put it. It reads source files and costs nothing, so it has no
# reason to move into this target's expensive lane.
expected_test_min = 4
description = "BR-AIL-21: the exported symbol graph equals AIKitPublicAPI.txt, no provider API is public, AIKitMLX exports one registration. Run: kagami test --scope AIKitPublicSurface"
