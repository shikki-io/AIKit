# AIKit kagami scopes (bootstrapped 2026-07-17 with the session-index migration).

[[scopes]]
name = "AgentSessionIndex"
language = "swift"
package_path = "."
type_patterns = ["AgentSessionIndexTests", "ClaudeSessionIndexTests", "AgentSessionEntry", "ClaudeSessionIndex", "AgentSessionIndexProvider", "ClaudeSessionIndexProvider"]
test_file_patterns = ["**/AIKitTests/AgentSessionIndexTests.swift"]
timeout = 120
expected_test_min = 12
description = "Session-store contract + claude conformer. Run: kagami test --scope AgentSessionIndex"

[[scopes]]
name = "AIKitAll"
language = "swift"
package_path = "."
type_patterns = ["Tests"]
test_file_patterns = ["**/AIKitTests/*.swift"]
timeout = 300
expected_test_min = 14
description = "Whole AIKitTests target. Run: kagami test --scope AIKitAll"

[[scopes]]
name = "AIKitProviders"
language = "swift"
package_path = "."
type_patterns = ["ProviderModelCatalog", "AnthropicFamily", "HistoricalAnthropicId", "ModelAliasMap", "ArgsTemplate", "CLISubprocessProviderConfig", "StreamEvent", "StreamParsing", "ClaudeCodeStreamJSONParser", "CursorTextParser", "AiderMixedParser", "ProviderHealthCheck", "AIProviderID", "AgentProviding", "BudgetLedger", "CLISubprocessProvider", "FallbackProviderChain", "LMStudioProvider", "ProviderModelCatalogTests", "ModelAliasResolutionTests", "ArgsTemplateRenderingTests", "ClaudeCodeStreamJSONParserTests", "CursorTextParserTests", "AiderMixedParserTests", "CLISubprocessProviderInitTests", "BudgetDeductionTests", "ConcurrencyCapTests", "FallbackProviderChainTests", "LMStudioProviderTests", "ProviderHealthCheckTests"]
test_file_patterns = ["**/AIKitTests/Providers/*.swift"]
timeout = 120
expected_test_min = 106
description = "Provider family relocated from shikki: catalog, alias map, args template, stream parsers, health check (S1) plus the CLI subprocess provider, fallback chain, LM Studio provider, budget ledger and provider-id vocabulary (S2). Run: kagami test --scope AIKitProviders"
